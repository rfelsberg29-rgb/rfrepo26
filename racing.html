<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>NIGHT SPRINT — Racing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0a1018;
      --chalk: #e8f0e9;
      --amber: #f5b942;
      --cyan: #3de0c5;
      --strike: #e84a3c;
      --muted: #8aa899;
      --glass: rgba(232, 240, 233, 0.08);
      --line: rgba(232, 240, 233, 0.18);
      --road: #1a222e;
      --asphalt: #121820;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Space Grotesk", sans-serif;
      color: var(--chalk);
      background:
        radial-gradient(ellipse 80% 50% at 20% -8%, rgba(245, 185, 66, 0.16), transparent 55%),
        radial-gradient(ellipse 65% 45% at 95% 5%, rgba(61, 224, 197, 0.12), transparent 50%),
        linear-gradient(165deg, #060a10 0%, var(--ink) 45%, #0c141c 100%);
      overflow-x: hidden;
      touch-action: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 47px, rgba(232, 240, 233, 0.03) 47px, rgba(232, 240, 233, 0.03) 48px),
        repeating-linear-gradient(90deg, transparent, transparent 47px, rgba(232, 240, 233, 0.03) 47px, rgba(232, 240, 233, 0.03) 48px);
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 420px;
      margin: 0 auto;
      padding: 1.25rem 1rem 2.5rem;
    }

    .hub-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-bottom: 0.85rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: color 0.15s;
    }

    .hub-link:hover { color: var(--amber); }

    header {
      text-align: center;
      margin-bottom: 1rem;
      animation: rise 0.65s ease-out both;
    }

    .brand {
      font-family: "Archivo Black", sans-serif;
      font-size: clamp(2.2rem, 10vw, 3.4rem);
      letter-spacing: 0.03em;
      line-height: 0.95;
      background: linear-gradient(180deg, #fff 15%, var(--amber) 55%, #e07a20 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .tag {
      margin-top: 0.45rem;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      animation: rise 0.65s ease-out 0.08s both;
    }

    .stat {
      flex: 1;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.65rem 0.75rem;
      text-align: center;
    }

    .stat label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.15rem;
    }

    .stat strong {
      font-family: "Archivo Black", sans-serif;
      font-size: 1.35rem;
      color: var(--amber);
    }

    .stage-wrap {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      background: var(--asphalt);
      animation: rise 0.65s ease-out 0.12s both;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      vertical-align: middle;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
      padding: 1.5rem;
      text-align: center;
      background: rgba(6, 10, 16, 0.82);
      backdrop-filter: blur(6px);
      transition: opacity 0.25s, visibility 0.25s;
    }

    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .overlay h2 {
      font-family: "Archivo Black", sans-serif;
      font-size: clamp(1.6rem, 6vw, 2.2rem);
      letter-spacing: 0.03em;
      line-height: 1.05;
    }

    .overlay p {
      color: var(--muted);
      max-width: 260px;
      line-height: 1.45;
      font-size: 0.95rem;
    }

    .btn {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.85rem 1.4rem;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--amber), #e89a20);
      color: #1a1204;
      transition: transform 0.12s, filter 0.15s;
    }

    .btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .btn:active { transform: translateY(1px); }

    .controls {
      margin-top: 1rem;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.6rem;
      animation: rise 0.65s ease-out 0.18s both;
    }

    .pad {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--glass);
      color: var(--chalk);
      border-radius: 14px;
      min-height: 56px;
      font-family: inherit;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.12s, border-color 0.12s;
    }

    .pad:active, .pad.held {
      background: rgba(245, 185, 66, 0.2);
      border-color: var(--amber);
    }

    .help {
      margin-top: 1rem;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
      line-height: 1.5;
      animation: rise 0.65s ease-out 0.22s both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 520px) {
      .controls { display: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="hub-link" href="index.html">← Challenge Games</a>
    <header>
      <div class="brand">NIGHT SPRINT</div>
      <p class="tag">Dodge traffic. Stretch the streak. Own the night.</p>
    </header>

    <div class="hud">
      <div class="stat"><label>Score</label><strong id="score">0</strong></div>
      <div class="stat"><label>Best</label><strong id="best">0</strong></div>
      <div class="stat"><label>Speed</label><strong id="speed">1×</strong></div>
    </div>

    <div class="stage-wrap">
      <canvas id="game" width="360" height="560" aria-label="Night Sprint racing game"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">Ready to roll</h2>
        <p id="overlay-copy">Steer with ← → or A D. Avoid the traffic and rack up distance.</p>
        <button class="btn" id="start-btn" type="button">Start Race</button>
      </div>
    </div>

    <div class="controls" aria-label="Touch controls">
      <button class="pad" id="left-btn" type="button">←</button>
      <button class="pad" id="boost-hint" type="button" disabled style="opacity:0.45">▲</button>
      <button class="pad" id="right-btn" type="button">→</button>
    </div>

    <p class="help">Desktop: arrow keys or A / D · Mobile: tap the pads · Crash ends the run</p>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const W = canvas.width;
      const H = canvas.height;
      const LANES = 3;
      const ROAD_PAD = 28;
      const ROAD_W = W - ROAD_PAD * 2;
      const LANE_W = ROAD_W / LANES;

      const scoreEl = document.getElementById("score");
      const bestEl = document.getElementById("best");
      const speedEl = document.getElementById("speed");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlay-title");
      const overlayCopy = document.getElementById("overlay-copy");
      const startBtn = document.getElementById("start-btn");

      const BEST_KEY = "night-sprint-best";
      let best = Number(localStorage.getItem(BEST_KEY) || 0);
      bestEl.textContent = String(best);

      const keys = { left: false, right: false };
      let running = false;
      let score = 0;
      let speed = 1;
      let roadOffset = 0;
      let player = { lane: 1, x: 0, y: H - 110, w: 42, h: 68 };
      let cars = [];
      let spawnTimer = 0;
      let last = 0;
      let animId = 0;

      function laneCenter(lane) {
        return ROAD_PAD + LANE_W * lane + LANE_W / 2;
      }

      function resetRun() {
        score = 0;
        speed = 1;
        roadOffset = 0;
        cars = [];
        spawnTimer = 0.8;
        player.lane = 1;
        player.x = laneCenter(1);
        updateHud();
      }

      function updateHud() {
        scoreEl.textContent = String(Math.floor(score));
        speedEl.textContent = speed.toFixed(1) + "×";
        bestEl.textContent = String(best);
      }

      function spawnCar() {
        const occupied = new Set(cars.filter((c) => c.y < 160).map((c) => c.lane));
        const choices = [0, 1, 2].filter((l) => !occupied.has(l));
        if (!choices.length) return;
        const lane = choices[Math.floor(Math.random() * choices.length)];
        const palette = ["#e84a3c", "#3de0c5", "#7c9cff", "#f0a0d0", "#9ae66e"];
        cars.push({
          lane,
          x: laneCenter(lane),
          y: -80,
          w: 42,
          h: 68,
          color: palette[Math.floor(Math.random() * palette.length)],
        });
      }

      function rectsOverlap(a, b) {
        const pad = 6;
        return (
          a.x - a.w / 2 + pad < b.x + b.w / 2 - pad &&
          a.x + a.w / 2 - pad > b.x - b.w / 2 + pad &&
          a.y - a.h / 2 + pad < b.y + b.h / 2 - pad &&
          a.y + a.h / 2 - pad > b.y - b.h / 2 + pad
        );
      }

      function endRun() {
        running = false;
        cancelAnimationFrame(animId);
        if (Math.floor(score) > best) {
          best = Math.floor(score);
          localStorage.setItem(BEST_KEY, String(best));
        }
        updateHud();
        overlayTitle.textContent = "Crash!";
        overlayCopy.textContent = `You scored ${Math.floor(score)}. Best: ${best}. Hit start for another lap.`;
        startBtn.textContent = "Race Again";
        overlay.classList.remove("hidden");
      }

      function drawCar(car, isPlayer) {
        const x = car.x;
        const y = car.y;
        const w = car.w;
        const h = car.h;
        ctx.save();
        ctx.translate(x, y);

        // body
        const grad = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
        if (isPlayer) {
          grad.addColorStop(0, "#f5b942");
          grad.addColorStop(0.5, "#ffe08a");
          grad.addColorStop(1, "#e89a20");
        } else {
          grad.addColorStop(0, car.color);
          grad.addColorStop(1, shade(car.color, -30));
        }
        roundRect(-w / 2, -h / 2, w, h, 10);
        ctx.fillStyle = grad;
        ctx.fill();

        // windshield
        ctx.fillStyle = "rgba(10, 20, 30, 0.55)";
        roundRect(-w * 0.32, -h * 0.28, w * 0.64, h * 0.22, 4);
        ctx.fill();

        // headlights / taillights
        ctx.fillStyle = isPlayer ? "#fff8d0" : "#ff6b5a";
        ctx.fillRect(-w * 0.34, h * 0.32, w * 0.18, 5);
        ctx.fillRect(w * 0.16, h * 0.32, w * 0.18, 5);

        ctx.restore();
      }

      function shade(hex, amt) {
        const n = hex.replace("#", "");
        const num = parseInt(n.length === 3 ? n.split("").map((c) => c + c).join("") : n, 16);
        let r = (num >> 16) + amt;
        let g = ((num >> 8) & 0xff) + amt;
        let b = (num & 0xff) + amt;
        r = Math.max(0, Math.min(255, r));
        g = Math.max(0, Math.min(255, g));
        b = Math.max(0, Math.min(255, b));
        return `rgb(${r},${g},${b})`;
      }

      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function drawRoad() {
        ctx.fillStyle = "#0c121a";
        ctx.fillRect(0, 0, W, H);

        // shoulders
        ctx.fillStyle = "#1c2836";
        ctx.fillRect(0, 0, ROAD_PAD - 4, H);
        ctx.fillRect(W - ROAD_PAD + 4, 0, ROAD_PAD - 4, H);

        // road
        ctx.fillStyle = "#18202c";
        ctx.fillRect(ROAD_PAD - 4, 0, ROAD_W + 8, H);

        // edge lines
        ctx.strokeStyle = "rgba(245, 185, 66, 0.55)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(ROAD_PAD, 0);
        ctx.lineTo(ROAD_PAD, H);
        ctx.moveTo(W - ROAD_PAD, 0);
        ctx.lineTo(W - ROAD_PAD, H);
        ctx.stroke();

        // lane dashes
        ctx.strokeStyle = "rgba(232, 240, 233, 0.35)";
        ctx.lineWidth = 4;
        ctx.setLineDash([22, 18]);
        ctx.lineDashOffset = -roadOffset;
        for (let i = 1; i < LANES; i++) {
          const x = ROAD_PAD + LANE_W * i;
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }
        ctx.setLineDash([]);

        // horizon glow
        const glow = ctx.createLinearGradient(0, 0, 0, 90);
        glow.addColorStop(0, "rgba(245, 185, 66, 0.12)");
        glow.addColorStop(1, "transparent");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, W, 90);
      }

      function drawFrame() {
        drawRoad();
        for (const car of cars) drawCar(car, false);
        drawCar(player, true);
      }

      function step(ts) {
        if (!running) return;
        const dt = Math.min(0.033, (ts - last) / 1000 || 0.016);
        last = ts;

        // steering
        if (keys.left) player.lane = Math.max(0, player.lane - 1), keys.left = false;
        if (keys.right) player.lane = Math.min(LANES - 1, player.lane + 1), keys.right = false;

        const targetX = laneCenter(player.lane);
        player.x += (targetX - player.x) * Math.min(1, dt * 14);

        speed = Math.min(3.2, 1 + score / 450);
        const scroll = 220 * speed * dt;
        roadOffset = (roadOffset + scroll) % 40;
        score += 18 * speed * dt;

        spawnTimer -= dt;
        if (spawnTimer <= 0) {
          spawnCar();
          spawnTimer = Math.max(0.45, 1.15 - speed * 0.22) + Math.random() * 0.25;
        }

        for (const car of cars) {
          car.y += scroll * (0.9 + (car.lane % 2) * 0.08);
          car.x += (laneCenter(car.lane) - car.x) * 0.2;
        }
        cars = cars.filter((c) => c.y < H + 100);

        for (const car of cars) {
          if (rectsOverlap(player, car)) {
            drawFrame();
            endRun();
            return;
          }
        }

        updateHud();
        drawFrame();
        animId = requestAnimationFrame(step);
      }

      function start() {
        resetRun();
        overlay.classList.add("hidden");
        running = true;
        last = performance.now();
        cancelAnimationFrame(animId);
        drawFrame();
        animId = requestAnimationFrame(step);
      }

      function onKey(e, down) {
        const k = e.key.toLowerCase();
        if (["arrowleft", "a"].includes(k)) {
          if (down) keys.left = true;
          e.preventDefault();
        }
        if (["arrowright", "d"].includes(k)) {
          if (down) keys.right = true;
          e.preventDefault();
        }
        if (down && (k === " " || k === "enter") && !running) {
          start();
          e.preventDefault();
        }
      }

      window.addEventListener("keydown", (e) => onKey(e, true));
      window.addEventListener("keyup", (e) => onKey(e, false));

      function bindPad(el, dir) {
        const press = (e) => {
          e.preventDefault();
          el.classList.add("held");
          keys[dir] = true;
        };
        const release = () => el.classList.remove("held");
        el.addEventListener("pointerdown", press);
        el.addEventListener("pointerup", release);
        el.addEventListener("pointerleave", release);
        el.addEventListener("pointercancel", release);
      }
      bindPad(document.getElementById("left-btn"), "left");
      bindPad(document.getElementById("right-btn"), "right");

      startBtn.addEventListener("click", start);

      // idle preview
      player.x = laneCenter(1);
      drawFrame();
    })();
  </script>
</body>
</html>
